services:
  app:
    image: agentx-near:latest
    container_name: agentx-near
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: agentx-near-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - web


networks:
  web:
    driver: bridge
